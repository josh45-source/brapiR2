on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

name: pkgcheck

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Mark workspace safe for git
        run: git config --global --add safe.directory /github/workspace

      - uses: ropensci-review-tools/pkgcheck-action@main

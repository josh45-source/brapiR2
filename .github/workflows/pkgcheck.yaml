on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

name: pkgcheck

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Mark workspace safe for git
        run: git config --global --add safe.directory /github/workspace

      # Pinned to the action's main as of our last green run (24 Sep 2026).
      - uses: ropensci-review-tools/pkgcheck-action@fa6dc3e9dec0580397ae44ec6fb9e7953947758c
